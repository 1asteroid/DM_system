version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-diplom_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    env_file:
      - .env
    environment:
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
    volumes:
      - uploads_data:/app/uploads
      - models_data:/app/models
    depends_on:
      - db
    networks:
      - web
      - internal
    restart: unless-stopped

  frontend:
    build: ./frontend
    networks:
      - web
    restart: unless-stopped

  bot:
    build: ./bot
    env_file:
      - .env
    depends_on:
      - backend
    networks:
      - web
      - internal
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - ./letsencrypt:/etc/letsencrypt:ro
      - ./certbot-www:/var/www/certbot
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
    networks:
      - web
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
  models_data:

networks:
  web:
    driver: bridge
  internal:
    driver: bridge

